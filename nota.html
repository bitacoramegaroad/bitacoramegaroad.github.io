<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Publicación de La Bitácora del Megaroad.">
  <title>Publicación | La Bitácora del Megaroad</title>
  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="css/indexstyle.css">
  <link rel="stylesheet" href="css/buscador.css">
</head>
<body class="document-page-body">
  <header class="macross-header">
    <a href="index.html" class="logo-link" aria-label="Volver al inicio de La Bitácora del Megaroad">
      <img src="img/LaBitacoraDelMegaroad.webp" alt="La Bitácora del Megaroad" class="logo">
    </a>
  </header>
  <main class="document-page">
    <h1 id="note-title" class="note-page-title">Cargando publicación…</h1>
    <article id="note-content" class="document-content">
      <p id="note-status" class="document-lead">Cargando el texto de la publicación…</p>
    </article>
    <section class="note-share" aria-label="Compartir esta nota">
      <button id="share-toggle" class="note-share-toggle" type="button" aria-expanded="false" aria-controls="share-options"><img src="img/boton-share.svg" alt="" aria-hidden="true"><span>Compartir</span></button>
      <div id="share-options" class="note-share-options" hidden>
        <a data-share="facebook" href="#" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a data-share="whatsapp" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a data-share="x" href="#" target="_blank" rel="noopener noreferrer">X</a>
        <button data-share-copy="Discord" type="button">Discord</button>
        <button data-share-copy="Instagram" type="button">Instagram</button>
        <button data-share-copy="Enlace" type="button">Copiar enlace</button>
      </div>
      <p id="share-status" class="note-share-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer class="macross-footer">
    <nav class="nav-bottom" aria-label="Navegación entre páginas">
      <ul><li><a href="index.html">Volver al inicio</a></li></ul>
    </nav>
  </footer>
  <div class="custom-cursor" aria-hidden="true"><svg class="reticle-svg" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg"><path d="M28 6 L2 18 L2 62 L28 74" fill="none" stroke="#00ffcc" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/><path d="M72 6 L98 18 L98 62 L72 74" fill="none" stroke="#00ffcc" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/><rect class="corner-square" x="79" y="75.5" width="13" height="20" fill="#00ffcc" transform="rotate(63 85 70)"/></svg><div class="lock-text">LOCK ON</div></div>
  <script src="js/note.js" defer></script>
  <script src="js/share.js" defer></script>
  <script src="js/favicons.js" defer></script>
  <script src="js/site-shell.js" defer></script>
</body>
</html>
