<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Fold Booster!</title>
  <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="css/fold_effect.css">
</head>
<body>

  <div class="viewport-3d">
    
    <!-- Contenedor del túnel acelerado por hardware con efecto Bloom -->
    <div class="canvas-gpu-bloom-chamber">
      <canvas id="foldCanvas"></canvas>
    </div>
    
    <!-- Centro absoluto del salto (Singularidad fija) -->
    <div class="singularity-core"></div>

    <!-- ====================================================================
       INTERFAZ DIGITAL PERIFÉRICA DEL HUD (CON IDENTIFICADORES DINÁMICOS)
       ==================================================================== -->
    <div class="hud-peripheral-overlay">
      <!-- Bloque Superior Izquierdo: Estado del Sistema -->
      <div class="hud-block block-top-left">
        <div class="hud-title">SYSTEM STATUS</div>
        <div>FOLD DRIVE: ENGAGED</div>
        <div>BOOSTER CAP: 94.2%</div>
        <div>SUPER DIMENSION FIELD: STABLE</div>
      </div>

      <!-- Bloque Superior Derecho: Datos de Navegación -->
      <div class="hud-block block-top-right">
        <div class="hud-title">NAV-COMPUTER</div>
        <div>DEST: SOL SECTOR</div>
        <div>DIST: 4.21ly / REQ</div>
        <!-- ID para la cuenta regresiva del ETA -->
        <div id="hud-eta" class="hud-pulse-text">ETA: 00:04:12</div>
      </div>

      <!-- Bloque Inferior Izquierdo: Parámetros del Motor -->
      <div class="hud-block block-bottom-left">
        <div class="hud-title">ENG-TELEMETRY</div>
        <div>THRUST: OVERRIDE</div>
        <!-- IDs para velocidad y temperatura variables -->
        <div id="hud-veff">V-EFF: 1.34ly/s</div>
        <div id="hud-temp">CORE TEMP: 842K</div>
      </div>

      <!-- Bloque Inferior Derecho: Alerta Táctica Estilo OVA -->
      <div class="hud-block block-bottom-right hud-alert-block">
        <div class="hud-alert-title">!!! WARNING !!!</div>
        <div>SPACE-TIME SHEAR: HIGH</div>
        <div>DIMENSIONAL PRESSURE</div>
        <div>MANUAL CONTROL ONLY</div>
      </div>
    </div>


    <!-- Contenedor de la cabina de referencia física -->
    <div class="cockpit-container">
      <svg class="cockpit-console" viewBox="0 0 800 500" xmlns="http://w3.org">
        <g class="console-hardware">
          <path d="M 150 500 L 250 400 L 550 400 L 650 500" fill="none" stroke="#222831" stroke-width="8" />
          <path d="M 0 450 L 150 410 L 250 400 L 230 450 L 130 460 L 0 500 Z" fill="#2d3748" stroke="#1a202c" stroke-width="3" />
          <path d="M 800 450 L 650 410 L 550 400 L 570 450 L 670 460 L 800 500 Z" fill="#2d3748" stroke="#1a202c" stroke-width="3" />
          
          <polygon points="50,445 70,440 50,475 30,480" fill="#ecc94b"/>
          <polygon points="90,435 110,430 90,465 70,470" fill="#ecc94b"/>
          <polygon points="130,425 150,420 130,455 110,460" fill="#ecc94b"/>
          
          <polygon points="750,445 730,440 750,475 770,480" fill="#ecc94b"/>
          <polygon points="710,435 690,430 710,465 730,470" fill="#ecc94b"/>
          <polygon points="670,425 650,420 670,455 695,460" fill="#ecc94b"/>
          
          <polygon points="250,400 200,320 270,300 530,300 600,320 550,400" fill="#0d1117" stroke="#3a4750" stroke-width="4" />
          <polygon points="200,320 130,325 160,365 220,355" fill="#161b22" stroke="#3a4750" stroke-width="2" />
          <polygon points="600,320 670,325 640,365 580,355" fill="#161b22" stroke="#3a4750" stroke-width="2" />
          
          <rect x="330" y="270" width="30" height="35" rx="5" fill="#1f2937" stroke="#374151" stroke-width="2" />
          <path d="M 335 275 L 355 275 M 335 282 L 355 282" stroke="#ecc94b" stroke-width="3" />
          <rect x="520" y="280" width="40" height="20" rx="4" fill="#1f2937" stroke="#374151" stroke-width="2" />
        </g>

        <g class="console-digital-hud">
          <polygon points="320,360 480,360 460,340 340,340" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.4" />
          <line x1="300" y1="370" x2="500" y2="370" stroke="#00ff66" stroke-width="2" />
          <line x1="330" y1="350" x2="470" y2="350" stroke="#00ff66" stroke-width="1" />
          <line x1="360" y1="330" x2="440" y2="330" stroke="#00ff66" stroke-width="1" />
          
          <path d="M 380 340 L 370 340 L 370 350 M 420 340 L 430 340 L 430 350" fill="none" stroke="#00ff66" stroke-width="2" />
          <path d="M 370 360 L 370 370 L 380 370 M 430 360 L 430 370 L 420 370" fill="none" stroke="#00ff66" stroke-width="2" />

          <rect x="250" y="325" width="40" height="25" fill="none" stroke="#00ff66" stroke-width="1" />
          <rect x="255" y="330" width="15" height="15" fill="#58a6ff" />
          <line x1="275" y1="333" x2="285" y2="333" stroke="#ffffff" stroke-width="2" />
          <line x1="275" y1="340" x2="285" y2="340" stroke="#ffffff" stroke-width="2" />
          
          <rect x="280" y="380" width="50" height="12" fill="none" stroke="#58a6ff" stroke-width="1" />
          <rect x="283" y="383" width="25" height="6" fill="#58a6ff" />

          <circle cx="515" cy="365" r="12" fill="none" stroke="#ffffff" stroke-width="1" />
          <path d="M 515 365 L 527 365 A 12 12 0 0 1 515 377 Z" fill="#58a6ff" />
          <rect x="535" y="330" width="20" height="10" fill="#ff7b72" />
          <rect x="535" y="345" width="20" height="10" fill="#58a6ff" />
          
          <text x="390" y="392" fill="#00ff66" font-size="10" font-family="'ConthraxSB', monospace" letter-spacing="1">SYS OK</text>
        </g>
      </svg>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('foldCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let time = 0;
    const fov = 350; 

    // Carga de la imagen de fondo de tu carpeta img/
    const bgImage = new Image();
    bgImage.src = 'img/Macross S-I 00.webp'; 

    // Configuración de los haces de líneas discontinuas rectos
    const streaksCount = 95; 
    const streaks = [];

    for(let i = 0; i < streaksCount; i++) {
      streaks.push({
        angle: Math.random() * Math.PI * 2,
        z: Math.random() * 1000,
        length: 140 + Math.random() * 120,
        colorOffset: Math.random() * 360 
      });
    }

    function drawScene() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Dibujar la ilustración webp fija de fondo
      if (bgImage.complete) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Renderizado de las líneas en perspectiva con velocidad original restaurada
      streaks.forEach(s => {
        // VELOCIDAD ORIGINAL RESTAURADA: Avance exacto e impacto idéntico al paso anterior
        s.z -= 16; 
        if (s.z <= 0) s.z = 1000; 

        const scale = fov / (fov + s.z);
        
        const distanceStart = (1000 - s.z) * 0.75 * scale;
        const distanceEnd = distanceStart + (s.length * scale);

        const x1 = centerX + Math.cos(s.angle) * distanceStart;
        const y1 = centerY + Math.sin(s.angle) * distanceStart;
        const x2 = centerX + Math.cos(s.angle) * distanceEnd;
        const y2 = centerY + Math.sin(s.angle) * distanceEnd;

        // Ciclo de color limpio restaurado al ritmo del fotograma original
        let currentHue = (time * 120 + s.colorOffset) % 360;

        // --- SATURACIÓN SUAVIZADA AL 50% MANTENIENDO EL RITMO DE AVANCE ---
        
        // HALO DE BLUR (Línea exterior difuminada)
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = `hsla(${currentHue}, 50%, 50%, ${scale * 0.20})`;
        ctx.lineWidth = 1536 * scale + 8; 
        ctx.stroke();

        // NÚCLEO NÍTIDO (Línea interior brillante)
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = `hsl(${currentHue}, 50%, 75%)`;
        ctx.lineWidth = 6.5 * scale + 2;
        ctx.stroke();
      });

      // Ritmo de reloj constante de la versión veloz
      time += 0.01;
      requestAnimationFrame(drawScene);
    }

    bgImage.onload = () => { drawScene(); };
    if (bgImage.complete) { drawScene(); }
	
    // ====================================================================
    // LÓGICA DE ACTUALIZACIÓN DINÁMICA DE LA TELEMETRÍA MILITAR
    // ====================================================================
    
    // Variables de control para los cálculos numéricos
    let coreTemperature = 842.0;
    let etaSeconds = 252; // 4 minutos y 12 segundos convertidos a base de tiempo
    let lastEtaUpdate = 0;

    function updateTelemetryData() {
      // 1. Variación de Eficiencia de Velocidad (V-EFF): Pequeño ruido decimal real
      const veffElement = document.getElementById('hud-veff');
      if (veffElement) {
        // Oscila sutilmente entre 1.31ly/s y 1.37ly/s
        let currentVeff = (1.34 + Math.sin(time * 2) * 0.03).toFixed(2);
        veffElement.innerText = `V-EFF: ${currentVeff}ly/s`;
      }

      // 2. Progresión Térmica del Motor (CORE TEMP): Sube lentamente por la fricción del salto
      const tempElement = document.getElementById('hud-temp');
      if (tempElement) {
        // Agrega un factor de incremento continuo roto por micro-fluctuaciones
        coreTemperature += 0.02 + (Math.random() - 0.5) * 0.4;
        // Evita lecturas destructivas fijando un tope máximo simulado
        if (coreTemperature > 989) coreTemperature = 842.0; 
        tempElement.innerText = `CORE TEMP: ${Math.floor(coreTemperature)}K`;
      }

      // 3. Cuenta Regresiva de Tiempo Estimado (ETA): Desciende un segundo real cada 1000ms
      const now = performance.now();
      if (now - lastEtaUpdate >= 1000) {
        const etaElement = document.getElementById('hud-eta');
        if (etaElement && etaSeconds > 0) {
          etaSeconds--;
          
          // Formateo matemático de los segundos a la estructura estándar 00:MM:SS
          let mins = Math.floor(etaSeconds / 60);
          let secs = etaSeconds % 60;
          
          let minStr = mins < 10 ? '0' + mins : mins;
          let secStr = secs < 10 ? '0' + secs : secs;
          
          etaElement.innerText = `ETA: 00:${minStr}:${secStr}`;
        }
        lastEtaUpdate = now;
      }
    }

    // INTERCEPCIÓN EN EL BUCLE PRINCIPAL DE CANVAS
    // Para que los datos cambien de forma síncrona al vuelo de las líneas,
    // inyectamos nuestra función al inicio de la ejecución de fotogramas.
    const originalDrawScene = drawScene;
    drawScene = function() {
      updateTelemetryData(); // Procesa los números del HUD antes de pintar el Canvas
      originalDrawScene();   // Ejecuta el renderizado de líneas y fondo original
    };	
  </script>

</body>
</html>
