<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d13">
  <meta name="description" content="Prueba privada del cartel de neón de La Bitácora del Megaroad.">
  <title>La Bitácora del Megaroad</title>
  <link rel="stylesheet" href="css/neon-test.css">
  <script src="js/neon-flicker.js" defer></script>
</head>
<body>
  <main class="stage" aria-label="Cartel de neón de La Bitácora del Megaroad">
    <div class="sign-frame" id="neonSign">
      <img class="sign-base" src="img/Cartel_neon_off.webp" alt="Cartel de La Bitácora del Megaroad">
      <svg class="neon-traces" id="neonTraces" viewBox="0 0 1502 1047" preserveAspectRatio="none" aria-hidden="true">
        <defs id="svgDefs">
          <image id="neonLinesSource" href="img/Cartel_neon_lineas.webp" x="0" y="0" width="1502" height="1047" preserveAspectRatio="none"></image>
          <mask id="steadyNeonMask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1502" height="1047" style="mask-type:luminance">
            <rect x="0" y="0" width="1502" height="1047" fill="white"></rect>
          </mask>
        </defs>
        <use class="steady-neon" href="#neonLinesSource" mask="url(#steadyNeonMask)"></use>
        <g id="independentLetters"></g>
      </svg>
    </div>
  </main>
</body>
</html>
